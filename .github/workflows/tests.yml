name: tests

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: [8.3, 8.4, 8.5]
        laravel: [12.*, 13.*]
        stability: [prefer-lowest, prefer-stable]
        include:
          # testbench and testbench-dusk major versions must stay aligned
          - laravel: 12.*
            testbench: 10.*
            testbench-dusk: 10.*
          - laravel: 13.*
            testbench: 11.*
            testbench-dusk: 11.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl
          # EGPCS is required so putenv()/process env reach $_ENV (pest type-coverage checks $_ENV).
          ini-values: error_reporting=E_ALL, variables_order=EGPCS
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          # Pin framework for the matrix; keep testbench packages in require-dev (--dev).
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" "orchestra/testbench-dusk:${{ matrix.testbench-dusk }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress --no-scripts
          composer run prepare
          # Force single-process type-coverage (Pokio multi-fork corrupts .temp/v3.php on CI)
          php scripts/patch-type-coverage-sync.php

      - name: Prepare Testbench bootstrap cache
        shell: bash
        run: mkdir -p vendor/orchestra/testbench-core/laravel/bootstrap/cache

      - name: PHPStan
        run: composer analyse

      - name: Linter
        run: composer lint:check

      - name: Type Coverage
        if: runner.os != 'Windows'
        env:
          __PEST_PLUGIN_ENV: '1'
        run: |
          set -e
          php scripts/patch-type-coverage-sync.php
          # Hard proof the vendor plugin no longer multi-forks
          grep -q 'MAILMANAGER_FORCE_TYPE_COVERAGE_SYNC\|pokio()->useSync()' vendor/pestphp/pest-plugin-type-coverage/src/Analyser.php
          grep -q '\$maxProcesses = 1' vendor/pestphp/pest-plugin-type-coverage/src/Analyser.php
          rm -rf vendor/pestphp/pest-plugin-type-coverage/.temp
          # Use the package entrypoint (never call raw pest --type-coverage in CI)
          composer test:types

      - name: Test Suite
        if: runner.os != 'Windows'
        run: composer test:unit

      - name: Test Suite (Windows)
        if: runner.os == 'Windows'
        run: vendor/bin/pest
